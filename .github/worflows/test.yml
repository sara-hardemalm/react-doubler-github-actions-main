name: Automatiska tester

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Kör tester och bygg appen
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v6

      - name: Installera Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installera paket
        run: npm ci

      - name: Kör tester
        run: npm run test:run

      - name: Bygg appen
        run: npm run build
